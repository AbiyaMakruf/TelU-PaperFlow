<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" style="background:#0b132b; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="bg-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#0b132b"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a86ff"/>
      <stop offset="100%" stop-color="#4895ef"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="chart-area" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a86ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3a86ff" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-glow)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Top Brand Header Bar -->
  <g transform="translate(60, 40)">
    <rect width="42" height="42" rx="10" fill="url(#accent-grad)"/>
    <text x="21" y="27" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle">P</text>
    <text x="56" y="28" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="-0.5">Paperflow</text>
    <rect x="175" y="10" width="115" height="24" rx="12" fill="#3a86ff" fill-opacity="0.2"/>
    <text x="232" y="26" font-size="11" font-weight="800" fill="#60a5fa" text-anchor="middle">paperflow.info</text>
  </g>

  <!-- Live Status Badge Top Right -->
  <g transform="translate(1000, 45)">
    <rect width="140" height="32" rx="16" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
    <circle cx="20" cy="16" r="4" fill="#10b981"/>
    <text x="32" y="20" font-size="12" font-weight="800" fill="#34d399">Production Live</text>
  </g>

  <!-- Main Application UI Mockup Container -->
  <g transform="translate(60, 100)" filter="url(#shadow)">
    <!-- Main Outer Window Frame -->
    <rect width="1080" height="480" rx="16" fill="url(#card-grad)" stroke="#cbd5e1" stroke-width="1"/>
    
    <!-- Browser Title Bar -->
    <path d="M 0,16 Q 0,0 16,0 L 1064,0 Q 1080,0 1080,16 L 1080,44 L 0,44 Z" fill="#0f172a"/>
    <circle cx="24" cy="22" r="5" fill="#ef4444"/>
    <circle cx="40" cy="22" r="5" fill="#f59e0b"/>
    <circle cx="56" cy="22" r="5" fill="#10b981"/>

    <!-- URL Bar -->
    <rect x="240" y="10" width="600" height="24" rx="6" fill="#1e293b"/>
    <text x="540" y="26" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">🔒 https://paperflow.info/dashboard (Active Conference: ICoICT 2026)</text>

    <!-- Navigation Header inside App -->
    <rect x="0" y="44" width="1080" height="50" fill="#ffffff"/>
    <line x1="0" y1="94" x2="1080" y2="94" stroke="#e2e8f0"/>
    
    <!-- Workspace Selector Button Mock -->
    <rect x="20" y="54" width="210" height="30" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="32" y="73" font-size="12" font-weight="800" fill="#1e293b">🏢 Conference: ICoICT 2026 ▾</text>

    <!-- Nav Items -->
    <text x="260" y="73" font-size="12" font-weight="900" fill="#2563eb">Dashboard</text>
    <rect x="260" y="92" width="62" height="2" fill="#2563eb"/>
    <text x="345" y="73" font-size="12" font-weight="700" fill="#64748b">Submissions</text>
    <text x="445" y="73" font-size="12" font-weight="700" fill="#64748b">Reconciliation</text>
    <text x="555" y="73" font-size="12" font-weight="700" fill="#64748b">Monitoring</text>
    <text x="645" y="73" font-size="12" font-weight="700" fill="#64748b">User Manual</text>

    <!-- User Profile Badge -->
    <rect x="940" y="55" width="120" height="28" rx="14" fill="#eff6ff"/>
    <text x="1000" y="73" font-size="11" font-weight="800" fill="#1e40af" text-anchor="middle">Superadmin ⚙️</text>

    <!-- Main Content Area -->
    <!-- Card 1: 14-Day Continuous Submission Analytics Chart -->
    <g transform="translate(20, 110)">
      <rect width="640" height="200" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="20" y="32" font-size="13" font-weight="900" fill="#0f172a">14-Day Submission Trend &amp; Peak Rate Analytics</text>
      <text x="540" y="32" font-size="11" font-weight="700" fill="#10b981">↗ +28.4% Volume</text>
      
      <!-- Chart Grid -->
      <line x1="40" y1="60" x2="600" y2="60" stroke="#f1f5f9"/>
      <line x1="40" y1="100" x2="600" y2="100" stroke="#f1f5f9"/>
      <line x1="40" y1="140" x2="600" y2="140" stroke="#f1f5f9"/>
      
      <!-- Smooth Gradient Area Fill -->
      <path d="M 40,140 Q 120,130 200,90 T 360,110 T 520,50 L 600,70 L 600,160 L 40,160 Z" fill="url(#chart-area)"/>
      <path d="M 40,140 Q 120,130 200,90 T 360,110 T 520,50 L 600,70" fill="none" stroke="#2563eb" stroke-width="3"/>
      
      <!-- Data Dots -->
      <circle cx="200" cy="90" r="4" fill="#2563eb"/>
      <circle cx="360" cy="110" r="4" fill="#2563eb"/>
      <circle cx="520" cy="50" r="5" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
    </g>

    <!-- Card 2: Status Breakdown Doughnut Metric -->
    <g transform="translate(680, 110)">
      <rect width="380" height="200" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="20" y="32" font-size="13" font-weight="900" fill="#0f172a">Editorial Status Distribution</text>

      <!-- Doughnut Circles -->
      <circle cx="100" cy="115" r="55" stroke="#f1f5f9" stroke-width="18" fill="none"/>
      <circle cx="100" cy="115" r="55" stroke="#2563eb" stroke-width="18" fill="none" stroke-dasharray="180 360"/>
      <circle cx="100" cy="115" r="55" stroke="#10b981" stroke-width="18" fill="none" stroke-dasharray="100 360" stroke-dashoffset="-180"/>
      <circle cx="100" cy="115" r="55" stroke="#f59e0b" stroke-width="18" fill="none" stroke-dasharray="60 360" stroke-dashoffset="-280"/>
      <text x="100" y="112" font-size="18" font-weight="900" fill="#0f172a" text-anchor="middle">142</text>
      <text x="100" y="127" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">Total Papers</text>

      <!-- Legend -->
      <g transform="translate(190, 55)">
        <rect x="0" y="10" width="10" height="10" rx="2" fill="#2563eb"/>
        <text x="18" y="19" font-size="11" font-weight="700" fill="#334155">Editorial Review (52%)</text>
        <rect x="0" y="35" width="10" height="10" rx="2" fill="#10b981"/>
        <text x="18" y="44" font-size="11" font-weight="700" fill="#334155">Approved / Done (28%)</text>
        <rect x="0" y="60" width="10" height="10" rx="2" fill="#f59e0b"/>
        <text x="18" y="69" font-size="11" font-weight="700" fill="#334155">Pre-EDAS Review (15%)</text>
        <rect x="0" y="85" width="10" height="10" rx="2" fill="#ef4444"/>
        <text x="18" y="94" font-size="11" font-weight="700" fill="#334155">Revision Requested (5%)</text>
      </g>
    </g>

    <!-- Bottom Section Card: IEEE Compliance Checklist & Portal Controls -->
    <g transform="translate(20, 325)">
      <rect width="1040" height="135" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      
      <!-- IEEE Compliance Badge -->
      <rect x="20" y="18" width="180" height="24" rx="6" fill="#1e3a8a"/>
      <text x="110" y="34" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">✓ 16 IEEE Compliance Rules</text>

      <!-- Subtitle -->
      <text x="215" y="34" font-size="12" font-weight="800" fill="#0f172a">Paper #PAPER-204 &middot; "Deep Learning Framework for Academic Editorial Workflow"</text>
      
      <!-- Interactive Chips -->
      <g transform="translate(20, 56)">
        <rect x="0" y="0" width="140" height="24" rx="12" fill="#dcfce7" stroke="#86efac"/>
        <text x="70" y="16" font-size="10" font-weight="800" fill="#166534" text-anchor="middle">✓ Title Format Passed</text>

        <rect x="150" y="0" width="150" height="24" rx="12" fill="#dcfce7" stroke="#86efac"/>
        <text x="225" y="16" font-size="10" font-weight="800" fill="#166534" text-anchor="middle">✓ Author Affiliation Passed</text>

        <rect x="310" y="0" width="160" height="24" rx="12" fill="#dcfce7" stroke="#86efac"/>
        <text x="390" y="16" font-size="10" font-weight="800" fill="#166534" text-anchor="middle">✓ Abstract &lt; 250 Words</text>

        <rect x="480" y="0" width="170" height="24" rx="12" fill="#ffe4e6" stroke="#f43f5e"/>
        <text x="565" y="16" font-size="10" font-weight="800" fill="#9f1239" text-anchor="middle">✕ PDF eXpress Status Failed</text>
      </g>

      <!-- Action Buttons -->
      <g transform="translate(20, 92)">
        <rect x="0" y="0" width="130" height="28" rx="6" fill="#ea580c"/>
        <text x="65" y="18" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">📄 Manuscript (.DOCX)</text>

        <rect x="140" y="0" width="140" height="28" rx="6" fill="#4f46e5"/>
        <text x="210" y="18" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">📘 Revision Guide (.PDF)</text>

        <rect x="290" y="0" width="150" height="28" rx="6" fill="#e11d48"/>
        <text x="365" y="18" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">📷 Camera-Ready (.PDF)</text>

        <rect x="860" y="0" width="160" height="28" rx="6" fill="#0284c7"/>
        <text x="940" y="18" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">🔗 Buka Portal Author ↗</text>
      </g>
    </g>
  </g>
</svg>
