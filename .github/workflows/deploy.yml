name: Deploy to Hostinger Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest

    steps:
      - name: Execute Remote SSH Commands for Deployment
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo "========================================================"
            echo "🚀 Starting Paperflow Deployment on Hostinger..."
            echo "========================================================"
            
            # 1. Navigate to deployment target directory
            cd ${{ secrets.TARGET_DIR }} || exit 1

            # 2. Pull latest changes from main branch
            echo "📦 [1/5] Fetching latest code from origin/main..."
            git fetch origin main
            git reset --hard origin/main

            # 3. Install PHP Dependencies (No Dev)
            echo "⚡ [2/5] Installing Composer dependencies..."
            composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

            # 4. Install Node Dependencies & Build Frontend Assets
            echo "🎨 [3/5] Building frontend assets..."
            if command -v pnpm &> /dev/null; then
              pnpm install
              pnpm build
            else
              npm install
              npm run build
            fi

            # 5. Flush Old Caches & Run Database Migrations
            echo "🗄️ [4/5] Running database migrations..."
            php artisan optimize:clear
            php artisan migrate --force

            # 6. Re-build Fresh Production Caches
            echo "🧹 [5/5] Caching routes, views, and configuration..."
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            # 7. Restart Queue Workers
            echo "🔄 Restarting queue workers..."
            php artisan queue:restart || true

            echo "========================================================"
            echo "🎉 Paperflow Deployment Successfully Completed!"
            echo "========================================================"
