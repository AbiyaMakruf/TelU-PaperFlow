name: Deploy to Hostinger Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest

    steps:
      - name: Execute Remote SSH Commands for Deployment
        uses: appleboy/ssh-action@v1.2.0
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: ENV_FILE
          script: |
            echo "========================================================"
            echo "🚀 Starting Paperflow Deployment on Hostinger..."
            echo "========================================================"
            
            # 1. Navigate to deployment target directory
            cd ${{ secrets.TARGET_DIR }} || exit 1

            # 2. Pull latest changes from main branch
            echo "📦 [1/6] Fetching latest code from origin/main..."
            git fetch origin main
            git reset --hard origin/main

            # 3. Sync .env file from GitHub Secret ENV_FILE if provided
            if [ -n "$ENV_FILE" ]; then
              echo "⚙️ [2/6] Syncing .env configuration from GitHub Secrets..."
              echo "$ENV_FILE" > .env
            fi

            # 4. Install PHP Dependencies (No Dev)
            echo "⚡ [3/6] Installing Composer dependencies..."
            composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

            # 5. Install Node Dependencies & Build Frontend Assets
            echo "🎨 [4/6] Building frontend assets..."
            if command -v pnpm &> /dev/null; then
              pnpm install
              pnpm build
            else
              npm install
              npm run build
            fi

            # 6. Clear Old Caches First (Flush All Stale Compiled Files)
            echo "🧹 [5/7] Flushing all old application caches..."
            php artisan optimize:clear
            php artisan cache:clear
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            php artisan event:clear

            # 7. Run Database Migrations
            echo "🗄️ [6/7] Running database migrations..."
            php artisan migrate --force

            # 8. Re-build Fresh Production Caches
            echo "⚡ [7/7] Re-building fresh production caches..."
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            # 9. Restart Queue Workers
            echo "🔄 Restarting queue workers..."
            php artisan queue:restart || true

            echo "========================================================"
            echo "🎉 Paperflow Deployment Successfully Completed!"
            echo "========================================================"
