name: Deploy to Hostinger Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest

    steps:
      - name: Execute Remote SSH Commands for Deployment
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo "========================================================"
            echo "🚀 Starting Paperflow Deployment on Hostinger..."
            echo "========================================================"
            
            # 1. Navigate to deployment target directory
            cd ${{ secrets.TARGET_DIR }} || exit 1

            # 2. Pull latest changes from main branch
            echo "📦 [1/5] Fetching latest code from origin/main..."
            git fetch origin main
            git reset --hard origin/main

            # 3. Install PHP Dependencies (No Dev)
            echo "⚡ [2/5] Installing Composer dependencies..."
            composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

            # 4. Install Node Dependencies & Build Frontend Assets
            echo "🎨 [3/5] Building frontend assets..."
            if command -v pnpm &> /dev/null; then
              pnpm install
              pnpm build
            else
              npm install
              npm run build
            fi

            # 5. Flush All Caches Completely (No static route/view/config cache stored during development)
            echo "🗄️ [4/5] Flushing all application caches & running database migrations..."
            rm -f bootstrap/cache/*.php storage/framework/views/*.php storage/framework/cache/data/* || true
            php artisan optimize:clear
            php artisan cache:clear
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            php artisan event:clear
            php artisan migrate --force

            # Purge Web OPcache via HTTP curl request
            TOKEN=$(php artisan eval "echo md5((string) config('app.key'));")
            curl -s -k "http://127.0.0.1/deploy-purge-cache?token=${TOKEN}" || curl -s -k "https://paperflow.info/deploy-purge-cache?token=${TOKEN}" || true

            echo "🧹 [5/5] All application & Web OPcache caches cleared cleanly."

            # 7. Process Pending Queue Jobs & Start Background Worker
            echo "🔄 Processing pending email jobs & launching background queue worker..."
            php artisan queue:restart || true
            php artisan queue:work --stop-when-empty || true
            pkill -f "php artisan queue:work" || true
            nohup php artisan queue:work --tries=3 > /dev/null 2>&1 &
            echo "✅ Queue worker actively running in background."

            echo "========================================================"
            echo "🎉 Paperflow Deployment Successfully Completed!"
            echo "========================================================"
