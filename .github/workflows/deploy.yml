name: Deploy to Hostinger Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest

    steps:
      - name: Execute Remote SSH Commands for Deployment
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo "========================================================"
            echo "🚀 Starting Paperflow Deployment on Hostinger..."
            echo "========================================================"
            
            # Export Node / NVM PATH for non-interactive SSH
            export PATH=$PATH:$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node 2>/dev/null | tail -n 1)/bin:$HOME/.local/bin:$HOME/bin:/usr/local/bin

            # Detect PHP 8.2+ CLI binary on Hostinger
            PHP_BIN="php"
            if command -v php82 &> /dev/null; then
              PHP_BIN="php82"
            elif command -v php8.2 &> /dev/null; then
              PHP_BIN="php8.2"
            elif [ -f /usr/bin/php8.2 ]; then
              PHP_BIN="/usr/bin/php8.2"
            elif [ -f /opt/alt/php82/usr/bin/php ]; then
              PHP_BIN="/opt/alt/php82/usr/bin/php"
            elif [ -f /usr/local/bin/php82 ]; then
              PHP_BIN="/usr/local/bin/php82"
            fi
            echo "🐘 Using PHP Binary: $PHP_BIN"

            # 1. Navigate to deployment target directory
            cd ${{ secrets.TARGET_DIR }} || exit 1

            # 2. Pull latest changes from main branch
            echo "📦 [1/5] Fetching latest code from origin/main..."
            git fetch origin main
            git reset --hard origin/main

            # 3. Install PHP Dependencies (No Dev)
            echo "⚡ [2/5] Installing Composer dependencies..."
            $PHP_BIN $(which composer) install --no-dev --optimize-autoloader --no-interaction --prefer-dist --ignore-platform-req=php+ || composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --ignore-platform-req=php+

            # 4. Install Node Dependencies & Build Frontend Assets
            echo "🎨 [3/5] Building frontend assets..."
            if command -v pnpm &> /dev/null; then
              pnpm install && pnpm build
            elif command -v npm &> /dev/null; then
              npm install && npm run build
            else
              echo "⚠️ Node/npm not found in SSH PATH, skipping frontend build step."
            fi

            # 5. Flush All Caches Completely (No static route/view/config cache stored during development)
            echo "🗄️ [4/5] Flushing all application caches & running database migrations..."
            rm -f bootstrap/cache/*.php storage/framework/views/*.php storage/framework/cache/data/* || true
            $PHP_BIN artisan optimize:clear
            $PHP_BIN artisan cache:clear
            $PHP_BIN artisan config:clear
            $PHP_BIN artisan route:clear
            $PHP_BIN artisan view:clear
            $PHP_BIN artisan event:clear
            $PHP_BIN artisan migrate --force

            # Purge Web OPcache via HTTP curl request
            TOKEN=$($PHP_BIN artisan eval "echo md5((string) config('app.key'));")
            curl -s -k "http://127.0.0.1/deploy-purge-cache?token=${TOKEN}" || curl -s -k "https://paperflow.info/deploy-purge-cache?token=${TOKEN}" || true

            echo "🧹 [5/5] All application & Web OPcache caches cleared cleanly."

            # 6. Process Pending Queue Jobs & Restart Workers
            echo "🔄 Processing pending email jobs & restarting queue workers..."
            $PHP_BIN artisan queue:restart || true
            $PHP_BIN artisan queue:work --stop-when-empty || true

            echo "========================================================"
            echo "🎉 Paperflow Deployment Successfully Completed!"
            echo "========================================================"
